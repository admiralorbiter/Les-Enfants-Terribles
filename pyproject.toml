[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "les-enfants-terribles"
version = "0.1.0"
description = "Personal cognitive research instrument and capture environment"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jonathan Lane" }
]
dependencies = [
    "flask>=3.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "werkzeug>=3.0.0"
]

[project.optional-dependencies]
transcription = [
    "faster-whisper>=1.0.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
let = "let.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
